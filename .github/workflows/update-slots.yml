name: Update slots

on:
  schedule:
    # 毎時0分 (UTC)。GitHub の仕様で遅延・欠落する場合があります
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-slots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch slots
        env:
          IRODAS_URL: ${{ secrets.IRODAS_URL }}
          # 認証が必要になった場合も、値は Secrets 経由でのみ渡す（コードに書かない）
        run: python scripts/fetch_slots.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/slots.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/slots.json
          git commit -m "Update slots"
          git push

name: Update slots

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-slots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      IRODAS_URL: ${{ secrets.IRODAS_URL }}
      IRODAS_SCHOOL: 駒澤大学
      IRODAS_FACULTY: 経済学部
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate parser with offline tests
        run: python -m unittest discover -s tests -v

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0
          python -m playwright install --with-deps chromium

      - name: Fetch public availability
        run: python scripts/fetch_slots.py

      - name: Commit validated snapshot
        run: |
          if git diff --quiet -- data/slots.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/slots.json
          git commit -m "Update slots"
          git push
